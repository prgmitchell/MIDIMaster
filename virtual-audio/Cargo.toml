[workspace]
members = ["service", "setup-helper"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
windows-service = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

