[package]
name = "midimaster-virtual-audio-service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "midimaster_virtual_audio_service"
path = "src/lib.rs"

[[bin]]
name = "midimaster-virtual-audio-service"
path = "src/main.rs"

[features]
perf-audit = []

[[bench]]
name = "audio_pipeline"
harness = false
required-features = ["perf-audit"]

[dependencies]
midimaster-virtual-audio-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
ctrlc = "3.4"

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices"
] }
