name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Validate tag matches app version
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          if (-not $tag.StartsWith("v")) { throw "Expected tag to start with 'v' (got '$tag')" }
          $expected = $tag.Substring(1)
          $cargoToml = Get-Content -Raw "src-tauri/Cargo.toml"
          $match = [regex]::Match($cargoToml, '(?m)^\s*version\s*=\s*"([^"]+)"\s*$')
          if (-not $match.Success) {
            throw "Could not parse package version from src-tauri/Cargo.toml."
          }
          $actual = $match.Groups[1].Value
          if ($actual -ne $expected) {
            throw "Tag version ($expected) does not match src-tauri/Cargo.toml version ($actual)."
          }

      - name: Install Tauri CLI
        working-directory: src-tauri
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install Windows bundler tools
        shell: pwsh
        run: |
          choco install nsis --no-progress -y

      - name: Validate updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace("${env:TAURI_SIGNING_PRIVATE_KEY}")) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY secret. Configure updater signing secrets before releasing."
          }

      - name: Validate Netlify publish secrets
        shell: pwsh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace("${env:NETLIFY_AUTH_TOKEN}")) {
            throw "Missing NETLIFY_AUTH_TOKEN secret."
          }
          if ([string]::IsNullOrWhiteSpace("${env:NETLIFY_SITE_ID}")) {
            throw "Missing NETLIFY_SITE_ID secret."
          }

      - name: Build (Tauri)
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles nsis

      - name: Generate updater metadata (latest.json)
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $repo = "${env:GITHUB_REPOSITORY}"

          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $setupExe = Get-ChildItem -Path $nsisDir -Filter *.exe |
            Where-Object { $_.Name -like "*setup*.exe" } |
            Select-Object -First 1

          if (-not $setupExe) {
            throw "Could not find NSIS setup executable in $nsisDir"
          }

          $sigPath = "$($setupExe.FullName).sig"
          if (-not (Test-Path $sigPath)) {
            throw "Missing signature file for updater artifact: $sigPath"
          }

          $signature = (Get-Content -Raw $sigPath).Trim()
          $downloadUrl = "https://github.com/$repo/releases/download/$tag/$($setupExe.Name)"

          $latest = @{
            version = $tag
            notes = "See release notes on GitHub."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $downloadUrl
              }
            }
          }

          $latestJsonPath = "src-tauri/target/release/bundle/latest.json"
          $latest | ConvertTo-Json -Depth 8 | Out-File -FilePath $latestJsonPath -Encoding utf8

      - name: Publish updater metadata to Netlify
        shell: pwsh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          $latestJsonPath = "src-tauri/target/release/bundle/latest.json"
          if (-not (Test-Path -LiteralPath $latestJsonPath)) {
            throw "Updater metadata file not found: $latestJsonPath"
          }

          $token = "${env:NETLIFY_AUTH_TOKEN}"
          $siteId = "${env:NETLIFY_SITE_ID}"
          $apiBase = "https://api.netlify.com/api/v1"
          $targetPath = "/updates/latest.json"

          $latestBytes = [System.IO.File]::ReadAllBytes($latestJsonPath)
          $sha1 = [System.BitConverter]::ToString(
            ([System.Security.Cryptography.SHA1]::Create().ComputeHash($latestBytes))
          ).Replace("-", "").ToLowerInvariant()

          $authHeaders = @{ Authorization = "Bearer $token" }
          $jsonHeaders = @{ Authorization = "Bearer $token"; "Content-Type" = "application/json" }

          $currentFiles = Invoke-RestMethod -Method Get -Uri "$apiBase/sites/$siteId/files" -Headers $authHeaders
          $filesMap = @{}
          foreach ($file in $currentFiles) {
            if ($null -ne $file.path -and $null -ne $file.sha) {
              $filesMap[[string]$file.path] = [string]$file.sha
            }
          }
          $filesMap[$targetPath] = $sha1

          $deployRequest = @{ files = $filesMap } | ConvertTo-Json -Depth 50 -Compress
          $deploy = Invoke-RestMethod -Method Post -Uri "$apiBase/sites/$siteId/deploys" -Headers $jsonHeaders -Body $deployRequest
          if ($null -eq $deploy.id) {
            throw "Netlify deploy creation failed: missing deploy id."
          }

          $required = @($deploy.required)
          $requiredOther = @($required | Where-Object { $_ -ne $sha1 })
          if ($requiredOther.Count -gt 0) {
            throw "Netlify requested upload of existing blobs not available in CI (sha: $($requiredOther -join ', ')). Run a full store redeploy once, then retry."
          }

          if ($required -contains $sha1) {
            $uploadUri = "$apiBase/deploys/$($deploy.id)/files/updates/latest.json"
            Invoke-RestMethod -Method Put -Uri $uploadUri -Headers @{ Authorization = "Bearer $token"; "Content-Type" = "application/octet-stream" } -Body $latestBytes | Out-Null
          }

          $maxAttempts = 20
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Start-Sleep -Seconds 2
            $deployState = Invoke-RestMethod -Method Get -Uri "$apiBase/sites/$siteId/deploys/$($deploy.id)" -Headers $authHeaders
            $state = [string]$deployState.state
            if ($state -eq "ready") {
              Write-Host "Netlify updater metadata deploy is ready (deploy id: $($deploy.id))."
              break
            }
            if ($attempt -eq $maxAttempts) {
              throw "Netlify updater metadata deploy did not reach 'ready' state. Last state: $state"
            }
          }

      - name: Prepare GitHub release asset list
        id: release_assets
        shell: pwsh
        env:
          UPDATER_BRIDGE_RELEASE: ${{ vars.UPDATER_BRIDGE_RELEASE }}
          UPDATER_BRIDGE_INCLUDE_SIG: ${{ vars.UPDATER_BRIDGE_INCLUDE_SIG }}
        run: |
          $bridgeRaw = "${env:UPDATER_BRIDGE_RELEASE}"
          if ([string]::IsNullOrWhiteSpace($bridgeRaw)) { $bridgeRaw = "true" }
          $bridgeEnabled = @("1", "true", "yes", "on") -contains $bridgeRaw.Trim().ToLowerInvariant()

          $includeSigRaw = "${env:UPDATER_BRIDGE_INCLUDE_SIG}"
          $includeSig = @("1", "true", "yes", "on") -contains $includeSigRaw.Trim().ToLowerInvariant()

          $files = @(
            "src-tauri/target/release/midimaster.exe"
            "src-tauri/target/release/bundle/nsis/*.exe"
          )

          if ($bridgeEnabled) {
            $files += "src-tauri/target/release/bundle/latest.json"
            if ($includeSig) {
              $files += "src-tauri/target/release/bundle/nsis/*.exe.sig"
            }
            Write-Host "Bridge release mode is ON."
          } else {
            Write-Host "Bridge release mode is OFF."
          }

          "files<<EOF" >> $env:GITHUB_OUTPUT
          $files -join "`n" >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MIDIMaster ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.release_assets.outputs.files }}
