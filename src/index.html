<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIDIMaster</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="dark-mode" data-theme="dark">
  <div class="app-shell sidebar-collapsed">
    <aside class="app-sidebar" aria-label="Primary navigation" data-i18n-aria-label="app.nav.primary">
      <div class="sidebar-brand">
        <img class="app-logo app-logo--theme" data-theme-logo data-dark-src="assets/MIDIMaster.png" data-light-src="assets/MIDIMaster-light.png" alt="MIDIMaster logo" />
        <span class="app-name">MIDIMaster</span>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-nav-indicator" aria-hidden="true"></div>
        <button class="sidebar-nav-item active" type="button" data-page="bindings" aria-current="page" aria-label="Bindings" title="Bindings" data-i18n-aria-label="app.nav.bindings" data-i18n-title="app.nav.bindings">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M6 4v16M12 4v16M18 4v16M4 8h4M10 15h4M16 11h4" />
            </svg>
          </span>
          <span class="nav-label" data-i18n="app.nav.bindings">Bindings</span>
        </button>
        <button id="connections-button" class="sidebar-nav-item" type="button" data-page="plugins" aria-label="Plugins" title="Plugins" data-i18n-aria-label="app.nav.plugins" data-i18n-title="app.nav.plugins">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M8 4v5M16 4v5M7 9h10v4a5 5 0 0 1-10 0V9ZM12 18v2" />
            </svg>
          </span>
          <span class="nav-label" data-i18n="app.nav.plugins">Plugins</span>
        </button>
        <button class="sidebar-nav-item" type="button" data-page="settings" aria-label="Settings" title="Settings" data-i18n-aria-label="app.nav.settings" data-i18n-title="app.nav.settings">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" />
              <path d="M15.5 5.5 17 4l3 3-1.5 1.5M8.5 5.5 7 4 4 7l1.5 1.5M15.5 18.5 17 20l3-3-1.5-1.5M8.5 18.5 7 20l-3-3 1.5-1.5M20 12h-2M6 12H4M12 4v2M12 18v2" />
            </svg>
          </span>
          <span class="nav-label" data-i18n="app.nav.settings">Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer" aria-label="Application information" data-i18n-aria-label="app.info">
        <div class="sidebar-footer-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 10v6"></path>
            <path d="M12 7.25h.01"></path>
          </svg>
        </div>
        <div class="sidebar-footer-meta">
          <span class="sidebar-footer-version-label" data-i18n="app.version">Version</span>
          <span id="sidebar-app-version" class="sidebar-footer-version">v-</span>
        </div>
      </div>
    </aside>

    <div class="app-workspace">
      <header class="topbar">
        <div class="topbar-field profile-topbar-field">
          <span class="topbar-label" data-i18n="topbar.profile">Profile</span>
          <div class="profile-select" id="profiles-dropdown">
            <button id="profile-toggle" class="select-button" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="profile-current" data-i18n="topbar.defaultProfile">Default</span>
              <span class="caret" aria-hidden="true">▾</span>
            </button>
            <div id="profile-list" class="dropdown hidden"></div>
          </div>
        </div>
        <div class="topbar-divider" aria-hidden="true"></div>
        <div class="topbar-field">
          <label class="topbar-label" for="midi-device" data-i18n="topbar.inputDevice">Input Device(s)</label>
          <select id="midi-device" title="Input Device(s)" data-i18n-title="topbar.inputDevice"></select>
        </div>
        <div class="topbar-field">
          <label class="topbar-label" for="midi-output-device" data-i18n="topbar.outputDevice">Output Device(s)</label>
          <select id="midi-output-device" title="Output Device(s)" data-i18n-title="topbar.outputDevice"></select>
        </div>
        <div class="topbar-actions">
          <button id="topbar-update-button" class="topbar-icon-button topbar-update-button hidden" type="button" aria-label="Update available" title="Update available" data-i18n-aria-label="topbar.updateAvailable" data-i18n-title="topbar.updateAvailable">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 4v10" />
              <path d="M8 10l4 4 4-4" />
              <path d="M5 19h14" />
            </svg>
            <span class="update-dot" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <main>
        <div id="alert-overlay" class="target-panel hidden">
          <div class="target-panel-content alert-panel-content">
            <div class="target-panel-header">
              <span id="alert-title" data-i18n="alert.title">Alert</span>
              <button id="alert-close" type="button" class="target-panel-close">x</button>
            </div>
            <div class="alert-panel-body">
              <p id="alert-message"></p>
              <div class="alert-panel-actions">
                <button id="alert-secondary" type="button" class="secondary hidden" data-i18n="common.skip">Skip</button>
                <button id="alert-cancel" type="button" class="secondary hidden" data-i18n="common.cancel">Cancel</button>
                <button id="alert-ok" type="button" data-i18n="common.ok">OK</button>
              </div>
            </div>
          </div>
        </div>

        <section id="main-screen" class="app-page active" data-page-panel="bindings">
          <div class="page-heading-row">
            <h1 data-i18n="bindings.title">Bindings</h1>
            <div class="bindings-toolbar">
              <div id="binding-type-filter" class="binding-type-filter" role="group" aria-label="Filter bindings" title="Filter bindings" data-i18n-aria-label="bindings.typeFilterLabel" data-i18n-title="bindings.typeFilterLabel">
                <button type="button" class="binding-type-segment selected" aria-pressed="true" data-filter="all" data-i18n="bindings.filterAll">All</button>
                <button type="button" class="binding-type-segment" aria-pressed="false" data-filter="faders" data-i18n="bindings.filterFaders">Faders</button>
                <button type="button" class="binding-type-segment" aria-pressed="false" data-filter="buttons" data-i18n="bindings.filterButtons">Buttons</button>
              </div>
              <label class="binding-search-field">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="m21 21-4.3-4.3M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14Z" />
                </svg>
                <input id="binding-search" type="search" placeholder="Search bindings..." autocomplete="off" data-i18n-placeholder="bindings.searchPlaceholder" />
              </label>
              <button id="binding-add-footer-button" type="button" class="binding-add-button">
                <span data-i18n="bindings.addBinding">Add Binding</span>
              </button>
              <div id="binding-density-toggle" class="binding-density-toggle" role="group" aria-label="Binding view density" data-i18n-aria-label="bindings.viewDensityLabel">
                <button type="button" class="binding-density-option selected" data-density="comfortable" aria-pressed="true" aria-label="Comfortable view" title="Comfortable view" data-i18n-aria-label="bindings.comfortableView" data-i18n-title="bindings.comfortableView">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M5 5h14v5H5zM5 14h14v5H5z" />
                  </svg>
                </button>
                <button type="button" class="binding-density-option" data-density="compact" aria-pressed="false" aria-label="Compact view" title="Compact view" data-i18n-aria-label="bindings.compactView" data-i18n-title="bindings.compactView">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M5 4h14v3H5zM5 10.5h14v3H5zM5 17h14v3H5z" />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div class="midi-inline-status visually-hidden" id="midi-status" data-i18n="bindings.selectDevices">Select input and output devices</div>

          <div class="bindings-card">
            <div class="binding-headers">
              <span class="binding-drag-header" aria-label="Reorder" data-i18n-aria-label="bindings.reorder"></span>
              <span data-i18n="common.name">Name</span>
              <span data-i18n="bindings.mode">Mode</span>
              <span data-i18n="common.target">Target</span>
              <span data-i18n="common.value">Value</span>
              <span class="binding-actions-header" data-i18n="common.actions">Actions</span>
            </div>
            <div id="bindings" class="list">
              <div class="bindings-empty" data-i18n="bindings.loading">Loading bindings...</div>
            </div>
          </div>
        </section>

        <section id="plugins-page" class="app-page hidden" data-page-panel="plugins">
          <div class="page-heading-row">
            <h1 data-i18n="plugins.title">Plugins</h1>
          </div>
          <div id="connections-panel" class="inline-panel connections-panel-content">
            <div class="connections-panel-body">
              <div id="connections-sidebar" class="connections-sidebar"></div>
              <div id="connections-content" class="connections-content"></div>
            </div>
          </div>
          <button id="connections-panel-close" type="button" class="visually-hidden" aria-hidden="true" data-i18n="common.close">Close</button>
        </section>

        <template data-feature-template="settings"></template>
      </main>
    </div>
  </div>

  <template data-feature-template="targets"></template>

  <template data-feature-template="bindings"></template>

  <div id="learn-panel" class="target-panel hidden">
    <div class="target-panel-content learn-panel-content">
      <div class="target-panel-header">
        <span id="learn-panel-title" data-i18n="bindings.waitingMidiTitle">Waiting for MIDI Input</span>
        <button id="learn-panel-close" type="button" class="target-panel-close">x</button>
      </div>
      <div class="learn-panel-body">
        <div id="learn-panel-spinner" class="learn-panel-spinner" aria-hidden="true"></div>
        <p id="learn-panel-message" data-i18n="bindings.learnMessage">Move a control on your MIDI device to create a binding.</p>
        <div id="learn-panel-actions" class="learn-panel-actions hidden">
          <button id="learn-panel-cancel" type="button" class="secondary" data-i18n="common.cancel">Cancel</button>
          <button id="learn-panel-confirm" type="button" data-i18n="common.transfer">Transfer</button>
        </div>
      </div>
    </div>
  </div>

  <div id="volume-osd" class="osd" aria-live="polite" aria-atomic="true">
  </div>

  <script type="module" src="main.js"></script>
</body>

</html>
