[package]
name = "midimaster"
version = "4.6.2"
edition = "2021"
default-run = "midimaster"
license = "MIT"
repository = "https://github.com/prgmitchell/MIDIMaster"
description = "Bind MIDI controls to system audio, devices, and plugin integrations"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
# Enables local-only benchmark hooks and isolated app-data overrides. Release
# bundles are built without this feature.
perf-audit = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2.0.0"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["time", "macros", "sync"] }
midir = "0.9"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.61", features = [
  "Win32_Devices_Display",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse"
] }
windows-core = "0.61"
tokio-tungstenite = "0.21"
futures-util = "0.3"
url = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
semver = "1"
rfd = "0.15"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-flac", "symphonia-mp3", "symphonia-aac", "symphonia-isomp4", "symphonia-ogg", "symphonia-vorbis", "symphonia-pcm", "symphonia-wav"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
winreg = "0.55"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "performance"
harness = false
required-features = ["perf-audit"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"

# Release-equivalent profiling build with symbols for WPR/WPA, Visual Studio,
# and native flame graph capture. It intentionally keeps the shipping
# optimization level so traces remain representative.
[profile.profiling]
inherits = "release"
debug = 2
strip = false
