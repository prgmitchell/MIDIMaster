name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install development tools
        run: npm.cmd ci

      - name: Verify generated bundled plugins
        run: npm.cmd run check:plugins

      - name: Check module ownership and size limits
        run: npm.cmd run check:architecture

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            virtual-audio -> target
          shared-key: windows-rust-v1
          cache-on-failure: true

      - name: Validate locale catalogs
        run: node scripts/i18n/validate-locales.mjs

      - name: Check locale translations are synchronized
        run: node scripts/i18n/translate-locales.mjs --dry-run --fail-on-pending

      - name: Scan unlocalized frontend strings
        run: node scripts/i18n/scan-unlocalized.mjs

      - name: Check frontend JavaScript syntax
        run: |
          $files = Get-ChildItem src,src-tauri/builtin_plugins,plugin-example,scripts -Recurse -Include *.js,*.mjs
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax error: $($file.FullName)" }
          }

      - name: Audit development dependencies
        run: npm.cmd audit --audit-level=low

      - name: Check static performance budgets
        run: npm.cmd run perf:guard

      - name: Format (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Check
        working-directory: src-tauri
        run: cargo check

      - name: Lint (clippy)
        working-directory: src-tauri
        run: cargo clippy --lib --bins --benches --all-features -- -D warnings

      - name: Lint default production features
        working-directory: src-tauri
        run: cargo clippy --lib --bins --locked -- -D warnings

      - name: Test real desktop workflows
        run: npm.cmd test

      - name: Upload desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e
          path: |
            test-results/desktop-*/*.json
            test-results/desktop-*/artifacts/*
            test-results/desktop-*/app-data/MIDIMaster/logs/*.log
          retention-days: 7

  virtual-audio-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            virtual-audio -> target
          shared-key: virtual-audio-windows-rust-v1

      - name: Format (rustfmt)
        working-directory: virtual-audio
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        working-directory: virtual-audio
        run: cargo clippy --workspace --lib --bins --benches --all-features -- -D warnings

      - name: Build virtual audio service and installer
        working-directory: virtual-audio
        run: cargo build --workspace --locked

  rust-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit both Rust lockfiles
        run: |
          cargo audit --file src-tauri/Cargo.lock
          cargo audit --file virtual-audio/Cargo.lock
