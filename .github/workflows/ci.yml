name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          shared-key: windows-rust-v1

      - name: Validate locale catalogs
        run: node scripts/i18n/validate-locales.mjs

      - name: Ensure locale catalogs are current
        run: node scripts/i18n/translate-locales.mjs --dry-run --fail-on-pending

      - name: Scan unlocalized frontend strings
        run: node scripts/i18n/scan-unlocalized.mjs

      - name: Check frontend JavaScript syntax
        run: |
          $files = Get-ChildItem src,src-tauri/builtin_plugins,plugin-example,scripts -Recurse -Include *.js,*.mjs
          foreach ($file in $files) {
            node --check $file.FullName
          }

      - name: Test frontend binding model
        run: node scripts/test-binding-model.mjs

      - name: Test frontend binding density
        run: node scripts/test-binding-density.mjs

      - name: Test frontend fader curve presets
        run: node scripts/test-fader-curve-presets.mjs

      - name: Test frontend binding value sync
        run: node scripts/test-binding-value-sync.mjs

      - name: Test frontend render batching
        run: node scripts/test-render-batching.mjs

      - name: Test frontend session refresh
        run: node scripts/test-session-refresh.mjs

      - name: Test Plugin Store frontend behavior
        run: node scripts/test-plugin-store.mjs

      - name: Test frontend MIDI device inventory consent
        run: node scripts/test-midi-device-inventory-consent.mjs

      - name: Test frontend MIDI route resolution
        run: node scripts/test-midi-hotplug.mjs

      - name: Test frontend MIDI route lifecycle
        run: node scripts/test-midi-feature.mjs

      - name: Test frontend focus target core
        run: node scripts/test-target-core-focus.mjs

      - name: Test frontend appearance settings
        run: node scripts/test-appearance.mjs

      - name: Test bundled Hue plugin
        run: node scripts/test-hue-plugin.mjs

      - name: Format (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Check
        working-directory: src-tauri
        run: cargo check

      - name: Lint (clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test
