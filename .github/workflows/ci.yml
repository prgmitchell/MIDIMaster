name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          shared-key: windows-rust-v1

      - name: Validate locale catalogs
        run: node scripts/i18n/validate-locales.mjs

      - name: Check locale translations are synchronized
        run: node scripts/i18n/translate-locales.mjs --dry-run --fail-on-pending

      - name: Scan unlocalized frontend strings
        run: node scripts/i18n/scan-unlocalized.mjs

      - name: Check frontend JavaScript syntax
        run: |
          $files = Get-ChildItem src,src-tauri/builtin_plugins,plugin-example,scripts -Recurse -Include *.js,*.mjs
          foreach ($file in $files) {
            node --check $file.FullName
          }

      - name: Test frontend
        run: npm.cmd test

      - name: Test performance tooling
        run: npm.cmd run perf:test

      - name: Check static performance budgets
        run: npm.cmd run perf:guard

      - name: Format (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Check
        working-directory: src-tauri
        run: cargo check

      - name: Lint (clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --all-features

  virtual-audio-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            virtual-audio -> target
          shared-key: virtual-audio-windows-rust-v1

      - name: Format (rustfmt)
        working-directory: virtual-audio
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        working-directory: virtual-audio
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: virtual-audio
        run: cargo test --workspace --all-features
